<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Survey Voxel GIS - Handheld Console (Prism Core)</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent-green: #00ffcc;
            --accent-red: #ff5555;
            --panel-bg: rgba(5, 5, 5, 0.9);
            --border-glow: rgba(0, 255, 204, 0.4);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--accent-green); font-family: 'Courier New', monospace; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        #view-container { position: relative; width: 100%; height: 100%; }
        
        /* 2D Prism Canvas Viewport */
        #map-canvas-2d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; transition: opacity 0.6s ease; }
        #map-canvas-2d:active { cursor: grabbing; }

        /* 3D Quantum Voxel Canvas */
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
        
        .active-3d #webgl-canvas { opacity: 1; pointer-events: auto; }
        .active-3d #map-canvas-2d { opacity: 0; pointer-events: none; }
        
        /* Floating Telemetry HUD (Expanded Full Width for iPad Landscape) */
        #hud { position: absolute; top: 16px; left: 16px; right: 16px; z-index: 10; background: var(--panel-bg); padding: 12px 18px; border: 1px solid var(--accent-green); border-radius: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; justify-content: space-between; align-items: center; flex-wrap: nowrap; gap: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.15); width: calc(100% - 32px); }
        
        .hud-col { display: flex; flex-direction: column; justify-content: center; }
        .hud-title { font-size: 0.85rem; margin: 0 0 2px 0; color: var(--accent-red); letter-spacing: 1px; font-weight: bold; white-space: nowrap; }
        .hud-info { font-size: 0.8rem; margin: 0; color: #bbb; white-space: nowrap; }
        .highlight { color: var(--accent-green); font-weight: bold; }

        /* Hardware Telemetry Full Width Expanded Bar */
        .hw-status { display: flex; justify-content: space-between; align-items: center; gap: 20px; background: rgba(0, 255, 204, 0.05); padding: 6px 12px; border-radius: 4px; border: 1px dashed rgba(0, 255, 204, 0.3); font-size: 0.8rem; flex: 1; max-width: 550px; }
        .hw-item { display: flex; align-items: center; gap: 8px; white-space: nowrap; }

        /* Bottom Handheld Console Control Deck (Thumb-Friendly for iPad/iPhone) */
        #console-deck { position: absolute; bottom: 20px; left: 16px; right: 16px; z-index: 10; background: var(--panel-bg); padding: 14px; border: 1px solid var(--accent-green); border-radius: 8px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        
        .deck-group { display: flex; gap: 10px; align-items: center; flex: 1; }
        input { background: #111; border: 1px solid #444; color: #fff; padding: 10px 12px; font-family: monospace; width: 100%; border-radius: 4px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--accent-green); }
        
        button { background: var(--accent-green); color: var(--bg-color); border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 0.9rem; transition: 0.2s; white-space: nowrap; flex: 1; box-shadow: 0 2px 8px rgba(0,255,204,0.3); }
        button:active { transform: scale(0.96); background: var(--accent-red); color: #fff; }

        /* Media Query สำหรับ iPad แนวนอน (Expanded Landscape Fit) */
        @media (min-width: 768px) {
            #hud { padding: 14px 24px; }
            .hw-status { font-size: 0.85rem; padding: 8px 16px; }
        }
    </style>
</head>
<body>
    <div id="view-container">
        <!-- 2D Prism Canvas Viewport -->
        <canvas id="map-canvas-2d"></canvas>
        <!-- 3D Quantum Voxel Canvas -->
        <canvas id="webgl-canvas"></canvas>
        
        <!-- Floating Telemetry HUD (Expanded Full Width) -->
        <div id="hud">
            <div class="hud-col">
                <p class="hud-title">[ PRISM CONSOLE GIS ]</p>
                <p class="hud-info">Lat/Lng: <span id="coords" class="highlight">18.7883, 98.9853</span></p>
            </div>

            <!-- สเกลช่อง IMU และ BMS ให้ขยายเต็มตาในแนวนอน iPad -->
            <div class="hw-status">
                <div class="hw-item">
                    <span>📡 IMU Buffer:</span>
                    <span class="highlight" id="imu-status">STABLE (0 Loss)</span>
                </div>
                <div class="hw-item">
                    <span>⚡ BMS Voltage:</span>
                    <span class="highlight" id="bms-status">12.6V (Optimal)</span>
                </div>
            </div>

            <div class="hud-col" style="text-align: right;">
                <p class="hud-info">FPS: <span id="fps" class="highlight">60</span></p>
                <p class="hud-info">Mode: <span id="mode-text" class="highlight">2D MAP</span></p>
            </div>
        </div>

        <!-- Bottom Handheld Console Deck (Thumb-Friendly) -->
        <div id="console-deck">
            <div class="deck-group">
                <input type="text" id="lat-input" value="18.7883" placeholder="Lat">
                <input type="text" id="lng-input" value="98.9853" placeholder="Lng">
            </div>
            <div class="deck-group" style="flex: 1.5;">
                <button id="transfer-btn">⚡ 3D TRANSITION</button>
            </div>
        </div>
    </div>

    <!-- Raw WebGL & Three.js CDN (Zero-Payload, 60FPS) -->
    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        // --- 1. 2D Prism Grid Viewport (Self-Contained) ---
        const mapCanvas = document.getElementById('map-canvas-2d');
        const ctx2d = mapCanvas.getContext('2d');
        let mapX = 0, mapY = 0, isDragging = false, startX, startY;
        let lat = 18.7883, lng = 98.9853;
        let active3D = false;

        function resize2D() {
            mapCanvas.width = window.innerWidth;
            mapCanvas.height = window.innerHeight;
            draw2DMap();
        }

        function draw2DMap() {
            ctx2d.fillStyle = '#0f1113';
            ctx2d.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

            const gridSize = 60;
            ctx2d.strokeStyle = '#1a2129';
            ctx2d.lineWidth = 1;

            const offsetX = mapX % gridSize;
            const offsetY = mapY % gridSize;

            for (let x = offsetX; x < mapCanvas.width; x += gridSize) {
                ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, mapCanvas.height); ctx2d.stroke();
            }
            for (let y = offsetY; y < mapCanvas.height; y += gridSize) {
                ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(mapCanvas.width, y); ctx2d.stroke();
            }

            const cx = mapCanvas.width / 2;
            const cy = mapCanvas.height / 2;
            ctx2d.strokeStyle = '#ff5555';
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            ctx2d.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx2d.stroke();

            ctx2d.fillStyle = '#00ffcc';
            ctx2d.font = '12px Courier New';
            ctx2d.fillText("📍 CONSOLE CENTER (Prism Active)", cx + 20, cy - 6);
        }

        mapCanvas.addEventListener('pointerdown', (e) => { isDragging = true; startX = e.clientX - mapX; startY = e.clientY - mapY; });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging || active3D) return;
            mapX = e.clientX - startX;
            mapY = e.clientY - startY;
            lat = 18.7883 - (mapY * 0.0001);
            lng = 98.9853 + (mapX * 0.0001);
            document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('lat-input').value = lat.toFixed(4);
            document.getElementById('lng-input').value = lng.toFixed(4);
            draw2DMap();
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        // --- 2. WebGL 3D Quantum Voxel Contour Engine ---
        const canvas3D = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 55, 75);
        camera.lookAt(0, 0, 0);

        const size = 45;
        const geometry = new THREE.BoxGeometry(0.85, 0.85, 0.85);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        
        const count = size * size;
        const voxelMesh = new THREE.InstancedMesh(geometry, material, count);
        voxelMesh.frustumCulled = true;

        const dummy = new THREE.Object3D();
        let idx = 0;
        for (let x = 0; x < size; x++) {
            for (let z = 0; z < size; z++) {
                const px = (x - size / 2) * 1.2;
                const pz = (z - size / 2) * 1.2;
                const py = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 6;
                dummy.position.set(px, py, pz);
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(idx++, dummy.matrix);
            }
        }
        scene.add(voxelMesh);

        // --- 3. Animation Loop & Telemetry ---
        let lastTime = performance.now();
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = Math.round((frameCount * 1000) / (now - lastTime));
                frameCount = 0;
                lastTime = now;
                const simulatedVoltage = (12.4 + Math.random() * 0.3).toFixed(2);
                document.getElementById('bms-status').innerText = `${simulatedVoltage}V (Optimal)`;
            }

            if (active3D) {
                voxelMesh.rotation.y += 0.004;
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- 4. Transition Action ---
        const btn = document.getElementById('transfer-btn');
        const container = document.getElementById('view-container');
        const modeText = document.getElementById('mode-text');

        btn.addEventListener('click', () => {
            active3D = !active3D;
            if (active3D) {
                container.classList.add('active-3d');
                btn.innerText = "🗺️ BACK TO 2D MAP";
                modeText.innerText = "3D QUANTUM VOXEL";
            } else {
                container.classList.remove('active-3d');
                btn.innerText = "⚡ 3D TRANSITION";
                modeText.innerText = "2D MAP";
            }
        });

        window.addEventListener('resize', () => {
            resize2D();
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resize2D();
    </script>
</body>
</html>
