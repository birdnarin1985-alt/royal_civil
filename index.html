<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Survey Voxel GIS - Royal Engineer Tactical Console (Prism Core)</title>
    <style>
        :root {
            --bg-color: #030507;
            --accent-green: #00ffcc;
            --accent-red: #ff3366;
            --accent-amber: #ffaa00;
            --panel-bg: rgba(3, 5, 7, 0.9);
            --border-glow: rgba(0, 255, 204, 0.35);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-color); color: var(--accent-green); font-family: 'Courier New', monospace; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        
        #view-container { position: relative; width: 100%; height: 100%; }
        
        /* 2D Prism Canvas Viewport */
        #map-canvas-2d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; transition: opacity 0.6s ease; }
        #map-canvas-2d:active { cursor: grabbing; }

        /* 3D Quantum Voxel Canvas */
        #webgl-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 0.6s ease; }
        
        .active-3d #webgl-canvas { opacity: 1; pointer-events: auto; }
        .active-3d #map-canvas-2d { opacity: 0; pointer-events: none; }

        /* --- TACTICAL SIDE-WINGS LAYOUT (Military Grade GIS) --- */
        .wing-panel { position: absolute; top: 16px; z-index: 10; width: 280px; background: var(--panel-bg); border: 1px solid var(--accent-green); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 12px; box-shadow: 0 0 20px rgba(0,255,204,0.12); display: flex; flex-direction: column; gap: 8px; }
        
        #left-wing { left: 16px; }
        #right-wing { right: 16px; }

        .wing-header { font-size: 0.75rem; color: var(--accent-red); font-weight: bold; border-bottom: 1px dashed rgba(255,51,102,0.4); padding-bottom: 4px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .data-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #aaa; }
        .data-val { color: var(--accent-green); font-weight: bold; }

        /* Tactical PIP Camera Stream View (Right Wing Integration) */
        #cam-container { width: 100%; height: 110px; background: #000; border: 1px solid #333; border-radius: 4px; overflow: hidden; position: relative; margin-top: 4px; }
        #tactical-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-overlay { position: absolute; bottom: 4px; left: 6px; font-size: 0.6rem; color: var(--accent-amber); background: rgba(0,0,0,0.6); padding: 2px 4px; border-radius: 2px; }

        /* --- BOTTOM HANDHELD CONSOLE DECK (Thumb-Friendly Control Hub) --- */
        #console-deck { position: absolute; bottom: 16px; left: 16px; right: 16px; z-index: 10; background: var(--panel-bg); padding: 12px 16px; border: 1px solid var(--accent-green); border-radius: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 4px 25px rgba(0,0,0,0.9); flex-wrap: wrap; }
        
        .deck-group { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 130px; }
        input { background: #111; border: 1px solid #444; color: #fff; padding: 8px 10px; font-family: monospace; width: 100%; border-radius: 4px; font-size: 0.8rem; outline: none; }
        input:focus { border-color: var(--accent-green); }
        
        button { background: var(--accent-green); color: var(--bg-color); border: none; padding: 9px 14px; font-weight: bold; cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 0.75rem; transition: 0.2s; white-space: nowrap; flex: 1; box-shadow: 0 2px 8px rgba(0,255,204,0.3); }
        button:active { transform: scale(0.96); background: var(--accent-red); color: #fff; }
        .btn-alt { background: #222; color: var(--accent-green); border: 1px solid var(--accent-green); }

        /* Media Query for iPad Landscape Opt */
        @media (max-width: 1024px) {
            .wing-panel { width: 240px; padding: 10px; }
            #cam-container { height: 90px; }
        }
    </style>
</head>
<body>
    <div id="view-container">
        <!-- 2D Prism Canvas Viewport -->
        <canvas id="map-canvas-2d"></canvas>
        <!-- 3D Quantum Voxel Canvas -->
        <canvas id="webgl-canvas"></canvas>
        
        <!-- --- LEFT WING: Spatial Telemetry & Real GPS --- -->
        <div id="wing-panel" class="wing-panel" id="left-wing" style="left: 16px;">
            <div class="wing-header">
                <span>[ SPATIAL TELEMETRY ]</span>
                <span style="color: var(--accent-green);">● LIVE</span>
            </div>
            <div class="data-row"><span>Lat/Lng:</span><span id="coords" class="data-val">18.7883, 98.9853</span></div>
            <div class="data-row"><span>Azimuth (True North):</span><span id="azimuth-val" class="data-val">045° NE</span></div>
            <div class="data-row"><span>Laser Rangefinder:</span><span id="laser-val" class="data-val">124.5 m</span></div>
            <div class="data-row"><span>Elevation (Z):</span><span id="elev-val" class="data-val">+342.1 MSL</span></div>
            <button id="gps-btn" class="btn-alt" style="margin-top: 4px; padding: 6px;">🛰️ LOCK REAL GPS</button>
        </div>

        <!-- --- RIGHT WING: Hardware Guard & Tactical Cam --- -->
        <div id="wing-panel" class="wing-panel" id="right-wing" style="right: 16px;">
            <div class="wing-header">
                <span>[ HARDWARE & OPTICAL ]</span>
                <span id="fps" class="data-val">60 FPS</span>
            </div>
            <div class="data-row"><span>IMU Ring Buffer:</span><span id="imu-status" class="data-val">STABLE (0 Loss)</span></div>
            <div class="data-row"><span>BMS Voltage:</span><span id="bms-status" class="data-val">12.6V (Optimal)</span></div>
            
            <!-- Tactical PIP Camera Stream -->
            <div id="cam-container">
                <video id="tactical-video" autoplay playsinline muted></video>
                <div class="cam-overlay">CAM: ACTIVE (PIP)</div>
            </div>
            <button id="cam-toggle" class="btn-alt" style="padding: 4px; font-size: 0.7rem;">📷 TOGGLE OPTICAL FEED</button>
        </div>

        <!-- --- BOTTOM HANDHELD CONSOLE DECK --- -->
        <div id="console-deck">
            <div class="deck-group">
                <input type="text" id="lat-input" value="18.7883" placeholder="Lat">
                <input type="text" id="lng-input" value="98.9853" placeholder="Lng">
            </div>
            <div class="deck-group" style="flex: 1.5; display: flex; gap: 8px;">
                <button id="pin-btn" class="btn-alt">📍 PIN TARGET</button>
                <button id="transfer-btn">⚡ 3D TRANSITION (<span id="mode-text">2D MAP</span>)</button>
            </div>
        </div>
    </div>

    <!-- Raw WebGL & Three.js CDN (Zero-Payload, 60FPS) -->
    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        // --- 1. 2D Prism Grid Viewport ---
        const mapCanvas = document.getElementById('map-canvas-2d');
        const ctx2d = mapCanvas.getContext('2d');
        let mapX = 0, mapY = 0, isDragging = false, startX, startY;
        let lat = 18.7883, lng = 98.9853;
        let active3D = false;
        const pinnedTargets = [];

        function resize2D() {
            mapCanvas.width = window.innerWidth;
            mapCanvas.height = window.innerHeight;
            draw2DMap();
        }

        function draw2DMap() {
            ctx2d.fillStyle = '#030507';
            ctx2d.fillRect(0, 0, mapCanvas.width, mapCanvas.height);

            const gridSize = 60;
            ctx2d.strokeStyle = '#0d161f';
            ctx2d.lineWidth = 1;

            const offsetX = mapX % gridSize;
            const offsetY = mapY % gridSize;

            for (let x = offsetX; x < mapCanvas.width; x += gridSize) {
                ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, mapCanvas.height); ctx2d.stroke();
            }
            for (let y = offsetY; y < mapCanvas.height; y += gridSize) {
                ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(mapCanvas.width, y); ctx2d.stroke();
            }

            // Draw Pinned Targets (Stateless Zero-Persistence)
            pinnedTargets.forEach((p, idx) => {
                ctx2d.fillStyle = '#ff3366';
                ctx2d.beginPath();
                ctx2d.arc(p.x, p.y, 6, 0, Math.PI * 2);
                ctx2d.fill();
                ctx2d.fillStyle = '#00ffcc';
                ctx2d.font = '10px Courier New';
                ctx2d.fillText(`TARGET #${idx+1}`, p.x + 10, p.y + 4);
            });

            const cx = mapCanvas.width / 2;
            const cy = mapCanvas.height / 2;
            ctx2d.strokeStyle = '#ff3366';
            ctx2d.lineWidth = 2;
            ctx2d.beginPath();
            ctx2d.arc(cx, cy, 16, 0, Math.PI * 2);
            ctx2d.stroke();

            ctx2d.fillStyle = '#00ffcc';
            ctx2d.font = '11px Courier New';
            ctx2d.fillText("🛡️ ROYAL ENGINEER CONSOLE (PRISM)", cx + 24, cy - 6);
        }

        mapCanvas.addEventListener('pointerdown', (e) => { isDragging = true; startX = e.clientX - mapX; startY = e.clientY - mapY; });
        window.addEventListener('pointermove', (e) => {
            if (!isDragging || active3D) return;
            mapX = e.clientX - startX;
            mapY = e.clientY - startY;
            lat = 18.7883 - (mapY * 0.0001);
            lng = 98.9853 + (mapX * 0.0001);
            document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
            document.getElementById('lat-input').value = lat.toFixed(4);
            document.getElementById('lng-input').value = lng.toFixed(4);
            document.getElementById('laser-val').innerText = (120 + Math.abs(mapX * 0.01)).toFixed(1) + " m";
            draw2DMap();
        });
        window.addEventListener('pointerup', () => { isDragging = false; });

        // --- 2. Real GPS Hardware Integration (Geolocation API) ---
        document.getElementById('gps-btn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your device');
                return;
            }
            document.getElementById('coords').innerText = "ACQUIRING GPS...";
            navigator.geolocation.getCurrentPosition((position) => {
                lat = position.coords.latitude;
                lng = position.coords.longitude;
                document.getElementById('coords').innerText = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                document.getElementById('lat-input').value = lat.toFixed(4);
                document.getElementById('lng-input').value = lng.toFixed(4);
                document.getElementById('azimuth-val').innerText = (position.coords.heading || 45).toFixed(0) + "° TRUE";
            }, (err) => {
                alert('GPS Lock Failed: Please allow location access.');
                document.getElementById('coords').innerText = "18.7883, 98.9853 (Fallback)";
            }, { enableHighAccuracy: true });
        });

        // --- 3. Tactical Camera Feed (PIP) ---
        const videoElem = document.getElementById('tactical-video');
        let camActive = true;
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                videoElem.srcObject = stream;
            } catch (e) {
                console.log("Camera optical feed unavailable in sandbox environment.");
            }
        }
        initCamera();

        document.getElementById('cam-toggle').addEventListener('click', () => {
            camActive = !camActive;
            if (camActive) {
                initCamera();
                videoElem.style.display = 'block';
            } else {
                if (videoElem.srcObject) {
                    videoElem.srcObject.getTracks().forEach(track => track.stop());
                }
                videoElem.style.display = 'none';
            }
        });

        // --- 4. Pin Target Action (Stateless RAM Only) ---
        document.getElementById('pin-btn').addEventListener('click', () => {
            pinnedTargets.push({ x: mapCanvas.width / 2, y: mapCanvas.height / 2 });
            draw2DMap();
        });

        // --- 5. WebGL 3D Quantum Voxel Contour Engine ---
        const canvas3D = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 50, 70);
        camera.lookAt(0, 0, 0);

        const size = 45;
        const geometry = new THREE.BoxGeometry(0.85, 0.85, 0.85);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        
        const count = size * size;
        const voxelMesh = new THREE.InstancedMesh(geometry, material, count);
        voxelMesh.frustumCulled = true; // สุญญตา: นอกจอทำลายทิ้ง เมตตาฮาร์ดแวร์

        const dummy = new THREE.Object3D();
        let idx = 0;
        for (let x = 0; x < size; x++) {
            for (let z = 0; z < size; z++) {
                const px = (x - size / 2) * 1.2;
                const pz = (z - size / 2) * 1.2;
                const py = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 6;
                dummy.position.set(px, py, pz);
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(idx++, dummy.matrix);
            }
        }
        scene.add(voxelMesh);

        // --- 6. Animation Loop & Telemetry ---
        let lastTime = performance.now();
        let frameCount = 0;
        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = Math.round((frameCount * 1000) / (now - lastTime)) + " FPS";
                frameCount = 0;
                lastTime = now;
                const simulatedVoltage = (12.4 + Math.random() * 0.3).toFixed(2);
                document.getElementById('bms-status').innerText = `${simulatedVoltage}V (Optimal)`;
            }

            if (active3D) {
                voxelMesh.rotation.y += 0.004;
            }
            renderer.render(scene, camera);
        }
        animate();

        // --- 7. Transition Action ---
        const btn = document.getElementById('transfer-btn');
        const container = document.getElementById('view-container');
        const modeText = document.getElementById('mode-text');

        btn.addEventListener('click', () => {
            active3D = !active3D;
            if (active3D) {
                container.classList.add('active-3d');
                modeText.innerText = "3D VOXEL";
            } else {
                container.classList.remove('active-3d');
                modeText.innerText = "2D MAP";
            }
        });

        window.addEventListener('resize', () => {
            resize2D();
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resize2D();
    </script>
</body>
</html>
